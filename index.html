<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7f1">
  <meta name="description" content="CampusFind helps students report, discover, and recover lost belongings around campus.">
  <title>CampusFind — Find it. Claim it. Bring it home.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-main">
      <a class="brand" href="#home" aria-label="CampusFind home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" role="img"><path d="M24 5.5 40 14.7v18.6L24 42.5 8 33.3V14.7Z"/><path d="m17 24 4.5 4.5L32 18"/></svg></span>
        <span class="brand-copy"><strong>CampusFind<span class="brand-dot">.</span></strong><span>Lost less. Found faster.</span></span>
      </a>
      <div class="header-actions">
        <a class="notification-link" href="#notifications" aria-label="Notifications"><span aria-hidden="true">♧</span><span>Updates</span><i id="notification-count">2</i></a>
        <a class="login-link" href="#login">Sign in <span aria-hidden="true">↗</span></a>
      </div>
    </div>
    <nav class="primary-nav" aria-label="Main navigation">
      <a href="#home" data-nav="home">Home</a>
      <a href="#browse" data-nav="browse">Browse items</a>
      <a href="#matches" data-nav="matches">Smart matches</a>
      <a href="#dashboard" data-nav="dashboard">Impact dashboard</a>
      <a href="#image-search" data-nav="image-search">Image search</a>
      <a href="#chat" data-nav="chat">Chat</a>
      <a href="#my-posts" data-nav="my-posts">My posts</a>
      <a href="#my-requests" data-nav="my-requests">My requests</a>
      <a href="#report-lost" data-nav="report-lost">＋ Report lost</a>
      <a href="#report-found" data-nav="report-found">＋ Report found</a>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="site-footer">
    <a class="footer-brand" href="#home"><span class="brand-mark small" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 5.5 40 14.7v18.6L24 42.5 8 33.3V14.7Z"/><path d="m17 24 4.5 4.5L32 18"/></svg></span>CampusFind<span class="brand-dot">.</span></a>
    <span>Small discoveries. Big relief. Made for campus communities.</span>
    <a class="footer-top" href="#home">Back to top ↑</a>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
